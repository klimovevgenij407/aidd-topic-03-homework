{% extends "dashboard/base.html" %}

{% block title %}Удаление акции{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Удаление акции</h1>
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить акцию <b>«{{ share.name }}» ({{ share.ticker }})</b>?</p>
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
