{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Акция в списке{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Акция в списке «{{ watchlist.name }}»</h1>
    <div class="row">
        <div class="col-md-6">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'monitoring:watchlist_detail' watchlist.pk %}" class="btn btn-outline-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
