{% extends "base.html" %}

{% block title %}Удаление операции{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Удаление операции</h1>
    <form method="post">
        {% csrf_token %}
        <p>Удалить операцию <b>{{ transaction.get_side_display }} {{ transaction.quantity }} {{ transaction.share.ticker }}</b>?</p>
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'portfolio:portfolio_detail' transaction.portfolio.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
