{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Операция портфеля{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Операция портфеля «{{ portfolio.name }}»</h1>
    <div class="row">
        <div class="col-md-7">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'portfolio:portfolio_detail' portfolio.pk %}" class="btn btn-outline-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
