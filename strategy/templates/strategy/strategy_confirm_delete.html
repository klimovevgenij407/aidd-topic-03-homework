{% extends "base.html" %}

{% block title %}Удаление стратегии{% endblock %}

{% block content %}
    <h1 class="h3 mb-3">Удаление стратегии</h1>
    <form method="post">
        {% csrf_token %}
        <p>Удалить стратегию <b>«{{ strategy.name }}»</b> и журнал её сделок?</p>
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'strategy:strategy_detail' strategy.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
